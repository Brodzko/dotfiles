<%
  # Required: WT_PATH (absolute path to worktree), WT_SESSION (tmux session name)
  # Optional: WT_BOOTSTRAP ("1" to run first-time setup in dev pane)
  wt_path     = ENV["WT_PATH"] || Dir.pwd
  session     = ENV["WT_SESSION"] || File.basename(wt_path)
  bootstrap   = ENV["WT_BOOTSTRAP"] == "1"

  # TODO: Replace hardcoded frontend bootstrap with per-repo contract (make worktree-init)
  # For now: pnpm install + dev server for elis-frontend-like repos
  bootstrap_cmd = if bootstrap
    "cp apps/elis/.env.example apps/elis/.env && pnpm install && echo '✅ Bootstrap complete. Run your dev server when ready.' && exec $SHELL"
  else
    ""
  end
%>

name: <%= session %>
root: "<%= wt_path %>"

# Reuse existing session — tmuxinator will attach if it already exists
# when `tmuxinator start` is called with the same session name.

windows:
  - main:
      # Layout: large left pane (spi) | right column split into top (editor) + bottom (dev/shell)
      layout: 70c2,165x49,0,0{110x49,0,0,70,54x49,111,0[54x24,111,0,73,54x24,111,25,74]}
      panes:
        - spi
        - code .; exec $SHELL
        - <%= bootstrap_cmd %>
